<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors Game</title>
    <link rel="stylesheet" href="style.css">
    <style>
     body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: linear-gradient(45deg, aqua, lightpink, yellow, purple);
    background-size: 400% 400%;
    animation: gradient-shift 8s infinite alternate ease-in-out;
    color: white;
    text-align: center;
}
        .container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title {
            text-align: center;
            background-color: aqua;
            color: red;
            font-family: 'Courier New', Courier, monospace;
            font-size: 3rem;
            margin-top: 2rem;
        }

        .porn {
    animation: dynamic-bounce 2s infinite ease-in-out;
    border: 4px solid red;
    border-radius: 15px;
    background: linear-gradient(45deg, aqua, lightpink);
    width: 800px;
    height: 200px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 2rem;
    font-weight: bold;
    color: black;
    text-shadow: 2px 2px 5px rgba(255, 255, 255, 0.5);
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
}

/* Keyframes for dynamic animation */
@keyframes dynamic-bounce {
    0% {
        transform: scale(1) rotate(0deg);
        background: linear-gradient(45deg, aqua, lightpink);
        border-color: red;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
    25% {
        transform: scale(1.1) rotate(10deg);
        background: linear-gradient(45deg, lightpink, yellow);
        border-color: orange;
        box-shadow: 0 0 25px rgba(255, 165, 0, 0.6);
    }
    50% {
        transform: scale(0.9) rotate(-10deg);
        background: linear-gradient(45deg, yellow, aqua);
        border-color: green;
        box-shadow: 0 0 30px rgba(0, 255, 0, 0.6);
    }
    75% {
        transform: scale(1.05) rotate(5deg);
        background: linear-gradient(45deg, aqua, pink);
        border-color: purple;
        box-shadow: 0 0 25px rgba(128, 0, 128, 0.6);
    }
    100% {
        transform: scale(1) rotate(0deg);
        background: linear-gradient(45deg, aqua, lightpink);
        border-color: red;
        box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
    }
}

    </style>
</head>

<body>
    <script src="javascript.js"></script>
    <div class="container">
        <div class="porn">
            <h1 class="title">Rock, Paper, Scissors</h1>
        </div>

    </div>

</body>

</html>
